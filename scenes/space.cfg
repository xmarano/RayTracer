camera : {
    resolution = { width = 1280; height = 720; };
    position   = { x = 0; y = 5; z = 20; };
    rotation   = { x = -5; y = 0; z = 0; }; // légère inclinaison vers le bas
    fieldOfView = 60.0;
};

primitives : {
    // Système solaire avec planètes et étoiles
    spheres = (
        // Soleil
        { x = 0; y = 0; z = 0; r = 4.0; color = { r = 255; g = 215; b = 0; }; },
        
        // Planètes
        { x = 8; y = 0; z = 0; r = 0.8; color = { r = 180; g = 180; b = 180; }; }, // Mercure
        { x = 12; y = 1; z = 0; r = 1.2; color = { r = 210; g = 180; b = 140; }; }, // Vénus
        { x = 16; y = -0.5; z = 2; r = 1.3; color = { r = 30; g = 100; b = 200; }; }, // Terre
        { x = 20; y = 0; z = -3; r = 1.0; color = { r = 210; g = 100; b = 70; }; }, // Mars
        
        // Astéroïdes
        { x = -2; y = 6; z = 5; r = 0.3; color = { r = 150; g = 150; b = 150; }; },
        { x = 3; y = 8; z = 7; r = 0.2; color = { r = 170; g = 170; b = 170; }; },
        { x = -4; y = 7; z = 3; r = 0.4; color = { r = 130; g = 130; b = 130; }; },
        { x = 5; y = 9; z = -2; r = 0.3; color = { r = 160; g = 160; b = 160; }; },
        
        // Étoiles lointaines
        { x = -15; y = 10; z = -20; r = 0.1; color = { r = 255; g = 255; b = 255; }; },
        { x = 20; y = 15; z = -15; r = 0.1; color = { r = 220; g = 240; b = 255; }; },
        { x = -25; y = 20; z = -10; r = 0.1; color = { r = 255; g = 230; b = 210; }; }
    );
    
    // Station spatiale et débris
    cylinders = (
        // Corps principal de la station spatiale
        { base = { x = -6; y = 2; z = 8; }; axis = { x = 0; y = 0; z = 1; }; radius = 0.7; height = 3; color = { r = 200; g = 200; b = 220; }; },
        // Modules de la station
        { base = { x = -6; y = 2; z = 8; }; axis = { x = 1; y = 0; z = 0; }; radius = 0.3; height = 2; color = { r = 180; g = 180; b = 200; }; },
        // Débris spatiaux
        { base = { x = 4; y = 3; z = 5; }; axis = { x = 0.5; y = 0.5; z = 0; }; radius = 0.2; height = 1.5; color = { r = 120; g = 120; b = 120; }; }
    );
    
    // Comètes et vaisseaux spatiaux
    cones = (
        // Comète
        { apex = { x = 10; y = 8; z = -5; }; axis = { x = -2; y = -1; z = 1; }; radius = 0.4; height = 3.0; color = { r = 200; g = 240; b = 255; }; },
        // Vaisseau spatial
        { apex = { x = -8; y = 0; z = 6; }; axis = { x = 1; y = 0; z = 0; }; radius = 0.5; height = 2.0; color = { r = 80; g = 100; b = 240; }; }
    );
    
    // Portes stellaires et structures
    triangles = (
        // Porte stellaire 1
        { a = { x = -10; y = 5; z = 0; }; b = { x = -8; y = 9; z = 0; }; c = { x = -6; y = 5; z = 0; }; color = { r = 100; g = 200; b = 255; }; },
        
        // Porte stellaire 2
        { a = { x = -10; y = 5; z = 0; }; b = { x = -8; y = 1; z = 0; }; c = { x = -6; y = 5; z = 0; }; color = { r = 100; g = 180; b = 235; }; },
        
        // Structure alien
        { a = { x = 15; y = 10; z = 15; }; b = { x = 18; y = 12; z = 12; }; c = { x = 12; y = 12; z = 12; }; color = { r = 180; g = 255; b = 180; }; },
        { a = { x = 15; y = 10; z = 15; }; b = { x = 12; y = 12; z = 12; }; c = { x = 15; y = 8; z = 12; }; color = { r = 160; g = 235; b = 160; }; }
    );
    
    // Planètes lointaines et fond étoilé
    planes = (
        { axis = "Z"; position = -30; color = { r = 5; g = 5; b = 20; }; }
    );
};

lights : {
    ambient = 0.1;
    diffuse = 0.8;
    
    point = (
        // Lumière du soleil
        { x = 0; y = 0; z = 0; intensity = 1.0; color = { r = 255; g = 240; b = 200; }; },
        
        // Lumière d'une étoile lointaine
        { x = -20; y = 15; z = -10; intensity = 0.3; color = { r = 220; g = 240; b = 255; }; },
        
        // Lumière de la station spatiale
        { x = -6; y = 2; z = 8; intensity = 0.2; color = { r = 200; g = 200; b = 255; }; }
    );
    
    directional = (
        { x = 0.5; y = -0.2; z = -0.8; }
    );
