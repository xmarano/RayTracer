camera : {
    resolution = { width = 1280; height = 720; };
    position   = { x = 0; y = 5; z = 18; };
    rotation   = { x = -10; y = 0; z = 0; };
    fieldOfView = 45.0;
};

primitives : {
    // Sculpture centrale - Sphères arrangées en spirale
    spheres = (
        // Spirale montante de sphères bleues à violettes
        { x = 0; y = 0.5; z = 0; r = 1.8; color = { r = 30; g = 60; b = 190; }; },
        { x = 1.5; y = 1.2; z = 1.0; r = 1.2; color = { r = 40; g = 80; b = 210; }; },
        { x = 2.8; y = 2.0; z = 1.8; r = 0.9; color = { r = 60; g = 90; b = 220; }; },
        { x = 3.7; y = 3.0; z = 2.4; r = 0.7; color = { r = 90; g = 100; b = 230; }; },
        { x = 4.2; y = 4.2; z = 2.8; r = 0.5; color = { r = 120; g = 80; b = 240; }; },
        
        // Spirale montante de sphères rouges à oranges
        { x = -1.5; y = 1.2; z = 1.0; r = 1.2; color = { r = 210; g = 50; b = 40; }; },
        { x = -2.8; y = 2.0; z = 1.8; r = 0.9; color = { r = 220; g = 70; b = 50; }; },
        { x = -3.7; y = 3.0; z = 2.4; r = 0.7; color = { r = 230; g = 100; b = 70; }; },
        { x = -4.2; y = 4.2; z = 2.8; r = 0.5; color = { r = 240; g = 140; b = 90; }; },
        
        // Sphères décoratives
        { x = 0; y = 7; z = 0; r = 0.8; color = { r = 255; g = 255; b = 255; }; },
        { x = 2.5; y = 0.7; z = -3; r = 1.0; color = { r = 20; g = 180; b = 140; }; },
        { x = -2.5; y = 0.7; z = -3; r = 1.0; color = { r = 180; g = 120; b = 20; }; }
    );
    
    // Triangles formant une structure cristalline
    triangles = (
        // Structure droite
        { a = { x = 3; y = 0; z = -2; }; b = { x = 5; y = 4; z = -1; }; c = { x = 4; y = 0; z = 0; }; color = { r = 180; g = 210; b = 240; }; },
        { a = { x = 5; y = 4; z = -1; }; b = { x = 6; y = 0; z = -2; }; c = { x = 4; y = 0; z = 0; }; color = { r = 160; g = 200; b = 230; }; },
        { a = { x = 3; y = 0; z = -2; }; b = { x = 5; y = 4; z = -1; }; c = { x = 6; y = 0; z = -2; }; color = { r = 140; g = 190; b = 220; }; },
        
        // Structure gauche
        { a = { x = -3; y = 0; z = -2; }; b = { x = -5; y = 4; z = -1; }; c = { x = -4; y = 0; z = 0; }; color = { r = 240; g = 180; b = 160; }; },
        { a = { x = -5; y = 4; z = -1; }; b = { x = -6; y = 0; z = -2; }; c = { x = -4; y = 0; z = 0; }; color = { r = 230; g = 160; b = 140; }; },
        { a = { x = -3; y = 0; z = -2; }; b = { x = -5; y = 4; z = -1; }; c = { x = -6; y = 0; z = -2; }; color = { r = 220; g = 140; b = 120; }; }
    );
    
    // Cylindres comme colonnes
    cylinders = (
        { base = { x = -7; y = 0; z = -5; }; axis = { x = 0; y = 1; z = 0; }; radius = 0.5; height = 6; color = { r = 200; g = 200; b = 200; }; },
        { base = { x = 7; y = 0; z = -5; }; axis = { x = 0; y = 1; z = 0; }; radius = 0.5; height = 6; color = { r = 200; g = 200; b = 200; }; }
    );
    
    // Cônes ornementaux
    cones = (
        { apex = { x = -7; y = 8; z = -5; }; axis = { x = 0; y = 1; z = 0; }; radius = 1.2; height = 2.0; color = { r = 220; g = 180; b = 130; }; },
        { apex = { x = 7; y = 8; z = -5; }; axis = { x = 0; y = 1; z = 0; }; radius = 1.2; height = 2.0; color = { r = 130; g = 180; b = 220; }; }
    );
    
    // Sol et murs
    planes = (
        { axis = "Y"; position = -0.5; color = { r = 10; g = 10; b = 30; }; },  // Sol sombre
        { axis = "Z"; position = -10; color = { r = 20; g = 20; b = 50; }; }     // Mur de fond
    );
};

lights : {
    ambient = 0.2;
    diffuse = 0.8;
    
    // Éclairage dramatique
    point = (
        { x = 0; y = 10; z = 5; intensity = 0.6; color = { r = 255; g = 255; b = 255; }; },    // Lumière principale
        { x = -8; y = 4; z = 4; intensity = 0.4; color = { r = 100; g = 120; b = 255; }; },    // Accentuation bleue
        { x = 8; y = 4; z = 4; intensity = 0.4; color = { r = 255; g = 160; b = 100; }; }      // Accentuation orange
    );
    
    directional = (
        { x = 0.2; y = -1; z = -0.4; }    // Lumière directionnelle discrète
    );
};
